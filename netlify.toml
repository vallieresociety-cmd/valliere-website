# Netlify configuration for the VALLIÈRE (Next.js 14 App Router) site.
# The official Next.js runtime plugin handles the build output, routing,
# and serverless/edge functions automatically — no publish dir needed.

[build]
  command = "npm run build"
  # Must not be the repo root; the Next.js runtime serves from .next.
  publish = ".next"

[build.environment]
  # Pin a Node version Next 14.2 fully supports.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security hardening headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
